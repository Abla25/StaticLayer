<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StaticLayer — vanilla example</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; max-width: 720px; margin: 48px auto; padding: 0 20px; color: #17130e; }
    h1 { letter-spacing: -0.03em; }
  </style>
</head>
<body>
  <h1>StaticLayer — vanilla example</h1>
  <p>This page shows the widget for the article path <code>/blog/hello-world</code>.</p>

  <!-- 1) The host element (attribute API) -->
  <div data-staticlayer
       data-api="https://comments.example.com"
       data-article-id="/blog/hello-world"></div>

  <!-- 2) The widget script (loads widget.js from your Worker) -->
  <script src="https://comments.example.com/widget.js" defer></script>
</body>
</html>
